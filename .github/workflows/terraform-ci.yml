
name: Terraform DevSecOps CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # -----------------------------------
  # JOB 1: TERRAFORM VALIDATION
  # -----------------------------------
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate


  # -----------------------------------
  # JOB 2: SONARQUBE ANALYSIS
  # -----------------------------------
  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: terraform-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true


  # -----------------------------------
  # JOB 3: TRIVY SECURITY SCAN
  # -----------------------------------
  trivy:
    name: Trivy IaC Security Scan
    runs-on: ubuntu-latest
    needs: terraform-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'


  # -----------------------------------
  # JOB 4: GENERATE SONARQUBE EXCEL
  # -----------------------------------
  sonarqube-report:
    name: Generate SonarQube Excel Report
    runs-on: ubuntu-latest

    needs:
      - terraform-checks
      - sonarqube

    # Continue after a Quality Gate failure.
    # Do not continue if Terraform failed or analysis was cancelled/skipped.
    if: >-
      always() &&
      needs.terraform-checks.result == 'success' &&
      needs.sonarqube.result != 'cancelled' &&
      needs.sonarqube.result != 'skipped'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      - name: Install report dependencies
        run: python -m pip install requests openpyxl

      - name: Generate SonarQube Excel Report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_BRANCH: ${{ github.head_ref || github.ref_name }}
          SONAR_PR: ${{ github.event.pull_request.number }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/sonarqube_report.py

      - name: Upload SonarQube Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report-${{ github.run_number }}
          path: reports/sonarqube-report.xlsx
          if-no-files-found: error
          retention-days: 30


  # -----------------------------------
  # JOB 5: TAIGA AUTOMATION
  # -----------------------------------
  taiga-sync:
    name: Create and Assign Taiga Security Tasks

    # Windows runner on the same machine as Taiga Docker.
    runs-on: [self-hosted, Windows, X64, taiga-local]

    needs:
      - sonarqube-report

    # Run even when SonarQube Quality Gate fails.
    # Requires successful Excel report generation.
    if: >-
      always() &&
      needs.sonarqube-report.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use the existing Windows Python installation.
      # Do not use actions/setup-python on this runner.
      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          where.exe python

      - name: Install Taiga integration dependencies
        shell: pwsh
        run: |
          python -m pip install pandas openpyxl requests

      - name: Download SonarQube Excel Report
        uses: actions/download-artifact@v4
        with:
          name: sonarqube-report-${{ github.run_number }}
          path: reports

      - name: Verify report exists
        shell: pwsh
        run: |
          if (!(Test-Path ".\reports\sonarqube-report.xlsx")) {
            throw "SonarQube Excel report was not downloaded."
          }

          Write-Host "SonarQube report found."

      - name: Check Taiga connectivity
        shell: pwsh
        env:
          TAIGA_URL: ${{ vars.TAIGA_URL }}
        run: |
          $response = Invoke-WebRequest `
            -Uri "$env:TAIGA_URL/api/v1/" `
            -UseBasicParsing

          Write-Host "Taiga API status: $($response.StatusCode)"

      - name: Synchronize SonarQube findings with Taiga
        shell: pwsh
        env:
          TAIGA_URL: ${{ vars.TAIGA_URL }}
          TAIGA_TOKEN: ${{ secrets.TAIGA_TOKEN }}
          TAIGA_PROJECT_ID: '1'
          TAIGA_USER_MAP: ${{ vars.TAIGA_USER_MAP }}
        run: python .\taiga_integration.py
