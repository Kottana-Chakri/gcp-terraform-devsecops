
name: Terraform DevSecOps CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # --------------------------------
  # JOB 1: TERRAFORM VALIDATION
  # --------------------------------
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate


  # --------------------------------
  # JOB 2: SONARQUBE ANALYSIS
  # --------------------------------
  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: terraform-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true


  # --------------------------------
  # JOB 3: TRIVY SECURITY SCAN
  # --------------------------------
  trivy:
    name: Trivy IaC Security Scan
    runs-on: ubuntu-latest
    needs: terraform-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'


  # --------------------------------
  # JOB 4: GENERATE SONARQUBE REPORT
  # --------------------------------
  sonarqube-report:
    name: Generate SonarQube Excel Report
    runs-on: ubuntu-latest

    needs:
      - terraform-checks
      - sonarqube

    # Generate the report even if the SonarQube quality gate fails.
    if: >-
      always() &&
      needs.terraform-checks.result == 'success' &&
      needs.sonarqube.result != 'cancelled' &&
      needs.sonarqube.result != 'skipped'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests openpyxl

      - name: Generate Excel report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_BRANCH: ${{ github.ref_name }}
          SONAR_PR: ${{ github.event.pull_request.number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/sonarqube_report.py

      - name: Upload SonarQube Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report-${{ github.run_number }}
          path: reports/sonarqube-report.xlsx
          if-no-files-found: error
          retention-days: 30


  # --------------------------------
  # JOB 5: CREATE TAIGA ISSUES
  # --------------------------------
  taiga-sync:
    name: Create Taiga Security Tasks

    # This runner must be installed on your Windows PC
    # where Docker Taiga is running.
    runs-on: [self-hosted, Windows, X64, taiga-local]

    needs:
      - sonarqube-report

    # Synchronize only main branch pushes and manual runs on main.
    if: >-
      needs.sonarqube-report.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pandas openpyxl requests

      - name: Download SonarQube report
        uses: actions/download-artifact@v4
        with:
          name: sonarqube-report-${{ github.run_number }}
          path: reports

      - name: Check Taiga connectivity
        shell: pwsh
        env:
          TAIGA_URL: ${{ vars.TAIGA_URL }}
        run: |
          $url = "$env:TAIGA_URL/api/v1/"
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing
          Write-Host "Taiga API status: $($response.StatusCode)"

      - name: Synchronize findings with Taiga
        env:
          TAIGA_URL: ${{ vars.TAIGA_URL }}
          TAIGA_TOKEN: ${{ secrets.TAIGA_TOKEN }}
        run: python taiga_integration.py
